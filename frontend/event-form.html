<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event form · CivicEvents</title>
  <meta name="description" content="CivicEvents — accessible city events and services portal.">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col" data-access="admin" data-page="event-form">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="app-header"></div>
  <main id="main" tabindex="-1" class="flex-1 w-full max-w-6xl mx-auto px-4 py-8">
    <div id="form-wrap" class="max-w-2xl mx-auto card p-6 sm:p-8">
      <a href="events.html" class="text-green-800 underline text-sm">← Back to events</a>
      <h1 id="form-title" class="text-2xl font-extrabold mt-2">Create event</h1>
      <form id="event-form" class="mt-5 space-y-4" novalidate>
        <div><label for="title" class="label">Title</label><input id="title" name="title" type="text" class="field" required maxlength="150"/></div>
        <div><label for="description" class="label">Description</label><textarea id="description" rows="5" class="field" required></textarea></div>
        <div><label for="location" class="label">Location</label><input id="location" name="location" type="text" class="field" required/></div>
        <div class="grid sm:grid-cols-2 gap-4"><div><label for="starts_at" class="label">Starts at</label><input id="starts_at" name="starts_at" type="datetime-local" class="field" required/></div><div><label for="ends_at" class="label">Ends at</label><input id="ends_at" name="ends_at" type="datetime-local" class="field" required/></div></div>
        <div><label for="image" class="label">Event image</label>
          <input id="image" type="file" accept=".jpg,.jpeg,.png,.gif" class="field bg-white" aria-describedby="image-hint"/>
          <p id="image-hint" class="text-xs text-slate-600 mt-1">JPG, PNG or GIF, up to 2 MB. Leave empty to keep the current image.</p>
          <img id="preview" alt="Preview of the selected event image" class="hidden mt-3 max-h-56 rounded-lg border border-slate-200"/></div>
        <div id="progress" class="hidden mt-3" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="h-2 bg-green-700 rounded transition-all" style="width:0%"></div></div>
        <div class="flex gap-2"><button id="save-btn" type="submit" class="btn-primary">Save event</button><a href="events.html" class="btn-secondary">Cancel</a></div>
      </form></div>
  </main>
  <div id="app-footer"></div>
  <div id="toast-region" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 max-w-sm" aria-live="polite"></div>
  <script src="js/vendor/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/registrations.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/event-form.js"></script>
</body>
</html>
