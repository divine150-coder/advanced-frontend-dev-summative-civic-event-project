<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · CivicEvents</title>
  <meta name="description" content="CivicEvents — accessible city events and services portal.">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col" data-access="user" data-page="events">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="app-header"></div>
  <main id="main" tabindex="-1" class="flex-1 w-full max-w-6xl mx-auto px-4 py-8">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div><h1 class="text-3xl font-extrabold">Events</h1><p class="text-slate-700">Discover what is happening in your city.</p></div>
      <div id="admin-actions" class="hidden"><a class="btn-primary" href="event-form.html">+ New event</a></div>
    </div>
    <form id="filter-form" class="card p-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-5 items-end mb-6" role="search" aria-label="Filter events">
      <div class="lg:col-span-2"><label for="f-search" class="label">Search</label><input id="f-search" type="search" class="field" placeholder="Title or keyword"/></div>
      <div><label for="f-location" class="label">Location</label><input id="f-location" type="text" class="field" placeholder="e.g. City Hall"/></div>
      <div><label for="f-date" class="label">Date</label><input id="f-date" type="date" class="field"/></div>
      <div class="flex gap-2"><button type="submit" class="btn-primary flex-1">Apply</button><button type="button" id="filter-reset" class="btn-secondary">Reset</button></div>
    </form>
    <p id="events-count" class="text-sm text-slate-700 mb-3" aria-live="polite"></p>
    <div id="events-grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></div>
    <div id="events-pager" class="mt-8"></div>
  </main>
  <div id="app-footer"></div>
  <div id="toast-region" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 max-w-sm" aria-live="polite"></div>
  <script src="js/vendor/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/registrations.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
