<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile · CivicEvents</title>
  <meta name="description" content="CivicEvents — accessible city events and services portal.">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col" data-access="user" data-page="profile">
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="app-header"></div>
  <main id="main" tabindex="-1" class="flex-1 w-full max-w-6xl mx-auto px-4 py-8">
    <div class="max-w-xl mx-auto card p-6 sm:p-8">
      <h1 class="text-2xl font-extrabold">My profile</h1>
      <dl class="grid grid-cols-3 gap-3 mt-4 text-sm bg-slate-50 border border-slate-200 rounded-lg p-4">
        <div><dt class="font-semibold">User ID</dt><dd id="p-id">—</dd></div>
        <div><dt class="font-semibold">Role</dt><dd id="p-role" class="capitalize">—</dd></div>
        <div><dt class="font-semibold">Status</dt><dd id="p-active">—</dd></div></dl>
      <p class="text-xs text-slate-600 mt-2">Role and status can only be changed by the system and are read-only here.</p>
      <form id="profile-form" class="mt-5 space-y-4" novalidate>
        <div><label for="full_name" class="label">Full name</label><input id="full_name" name="full_name" type="text" class="field" required autocomplete="name"/></div><div><label for="email" class="label">Email</label><input id="email" name="email" type="email" class="field" required autocomplete="email"/></div>
        <button id="save-btn" type="submit" class="btn-primary">Save changes</button>
      </form></div>
  </main>
  <div id="app-footer"></div>
  <div id="toast-region" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 max-w-sm" aria-live="polite"></div>
  <script src="js/vendor/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/registrations.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
